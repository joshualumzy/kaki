<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">The path of one follow-up</title>
  <desc id="desc">A spoken line becomes a proposed follow-up with evidence, the owner dispatches it to a seat, a private card appears on that seat, Do it for me makes a draft, a person approves it, a grounding check compares it with its source, and Mailpit receives the email.</desc>
  <defs>
    <style>
      text { font-family: Geist, Inter, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 22px; font-weight: 700; fill: #0d1117; }
      .s { font-size: 14px; fill: #5a6472; }
      .z { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #5a6472; }
      .h { font-size: 15px; font-weight: 600; fill: #0d1117; }
      .b { font-size: 13px; fill: #5a6472; }
      .n { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #5a6472; }
      .l { font-size: 12px; font-weight: 600; fill: #5a6472; }
      .ln { fill: none; stroke: #5a6472; stroke-width: 1.5; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5a6472"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="559" rx="20" fill="#ffffff" stroke="#d8dde3"/>
  <text class="t" x="40" y="52">The path of one follow-up</text>
  <text class="s" x="40" y="78">From a spoken line to a sent email, with a person in charge at every step that changes something.</text>
  <text class="z" x="52" y="132">IN THE MEETING · KAKI HOST AND THE SEAT</text>
  <rect x="52" y="150" width="152" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="80" cy="178" r="13" fill="#5a6472"/><text class="n" x="80" y="182.5" text-anchor="middle">1</text>
  <text class="h" x="68" y="216">Someone speaks</text>
  <text class="b" x="68" y="238">“I’ll email the</text>
  <text class="b" x="68" y="256">supplier.”</text>
  <path class="ln" d="M204 210 H228" marker-end="url(#a)"/>
  <rect x="228" y="150" width="152" height="120" rx="12" fill="#fff1eb" stroke="#ff5a1f" stroke-width="1.5"/>
  <circle cx="256" cy="178" r="13" fill="#ff5a1f"/><text class="n" x="256" y="182.5" text-anchor="middle">2</text>
  <text class="h" x="244" y="216">Notetaker</text>
  <text class="b" x="244" y="238">suggests a follow-up,</text>
  <text class="b" x="244" y="256">quoting the line</text>
  <text class="m" x="244" y="292">notetakerTasks.ts</text>
  <path class="ln" d="M380 210 H404" marker-end="url(#a)"/>
  <rect x="404" y="150" width="152" height="120" rx="12" fill="#eff0ff" stroke="#5865ff" stroke-width="1.5"/>
  <circle cx="432" cy="178" r="13" fill="#5865ff"/><text class="n" x="432" y="182.5" text-anchor="middle">3</text>
  <text class="h" x="420" y="216">Dispatch</text>
  <text class="b" x="420" y="238">the owner sends it</text>
  <text class="b" x="420" y="256">to that person’s seat</text>
  <text class="m" x="420" y="292">autoDispatch.ts</text>
  <path class="ln" d="M556 210 H580" marker-end="url(#a)"/>
  <rect x="580" y="150" width="152" height="120" rx="12" fill="#eff0ff" stroke="#5865ff" stroke-width="1.5"/>
  <circle cx="608" cy="178" r="13" fill="#5865ff"/><text class="n" x="608" y="182.5" text-anchor="middle">4</text>
  <text class="h" x="596" y="216">Private card</text>
  <text class="b" x="596" y="238">only that seat’s</text>
  <text class="b" x="596" y="256">dock receives it</text>
  <text class="m" x="596" y="292">meeting/tasks.ts</text>
  <path class="ln" d="M732 210 H756" marker-end="url(#a)"/>
  <rect x="756" y="150" width="152" height="120" rx="12" fill="#eff0ff" stroke="#5865ff" stroke-width="1.5"/>
  <circle cx="784" cy="178" r="13" fill="#5865ff"/><text class="n" x="784" y="182.5" text-anchor="middle">5</text>
  <text class="h" x="772" y="216">Do it for me</text>
  <text class="b" x="772" y="238">the owner picks</text>
  <text class="b" x="772" y="256">email</text>
  <rect x="52" y="346" width="152" height="120" rx="12" fill="#fff1eb" stroke="#ff5a1f" stroke-width="1.5"/>
  <circle cx="80" cy="374" r="13" fill="#ff5a1f"/><text class="n" x="80" y="378.5" text-anchor="middle">6</text>
  <text class="h" x="68" y="412">Draft</text>
  <text class="b" x="68" y="434">Kaki Action writes,</text>
  <text class="b" x="68" y="452">the owner edits</text>
  <path class="ln" d="M204 406 H228" marker-end="url(#a)"/>
  <rect x="228" y="346" width="152" height="120" rx="12" fill="#eff0ff" stroke="#5865ff" stroke-width="1.5"/>
  <circle cx="256" cy="374" r="13" fill="#5865ff"/><text class="n" x="256" y="378.5" text-anchor="middle">7</text>
  <text class="h" x="244" y="412">Approve</text>
  <text class="b" x="244" y="434">a person signs off</text>
  <text class="b" x="244" y="452">before anything runs</text>
  <path class="ln" d="M380 406 H404" marker-end="url(#a)"/>
  <rect x="404" y="346" width="152" height="120" rx="12" fill="#fff1eb" stroke="#ff5a1f" stroke-width="1.5"/>
  <circle cx="432" cy="374" r="13" fill="#ff5a1f"/><text class="n" x="432" y="378.5" text-anchor="middle">8</text>
  <text class="h" x="420" y="412">Grounding check</text>
  <text class="b" x="420" y="434">draft is checked</text>
  <text class="b" x="420" y="452">against its source</text>
  <text class="m" x="420" y="488">draftGrounding.ts</text>
  <path class="ln" d="M556 406 H580" marker-end="url(#a)"/>
  <rect x="580" y="346" width="152" height="120" rx="12" fill="#e6f6f3" stroke="#00a58e" stroke-width="1.5"/>
  <circle cx="608" cy="374" r="13" fill="#00a58e"/><text class="n" x="608" y="378.5" text-anchor="middle">9</text>
  <text class="h" x="596" y="412">Mailpit</text>
  <text class="b" x="596" y="434">the email is sent</text>
  <text class="b" x="596" y="452">by the connector</text>
  <text class="m" x="596" y="488">action/email.ts</text>
  <path class="ln" d="M832 270 V306 H128 V346" marker-end="url(#a)"/>
  <text class="z" x="152" y="338">AFTER THE PRESS · KAKI ACTION</text>
  <rect x="52" y="514" width="14" height="14" rx="4" fill="#fff1eb" stroke="#ff5a1f" stroke-width="1.5"/>
  <text class="b" x="74" y="526">Kaki agent</text>
  <rect x="178" y="514" width="14" height="14" rx="4" fill="#eff0ff" stroke="#5865ff" stroke-width="1.5"/>
  <text class="b" x="200" y="526">a person on their seat</text>
  <rect x="368" y="514" width="14" height="14" rx="4" fill="#e6f6f3" stroke="#00a58e" stroke-width="1.5"/>
  <text class="b" x="390" y="526">company tool</text>
</svg>
