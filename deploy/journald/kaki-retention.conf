# Installed on the VM as /etc/systemd/journald.conf.d/kaki-retention.conf.
# Kaki keeps its server and meeting logs so the team can investigate playtest complaints, and the
# logs can contain meeting text. This caps the journal at 30 days. Rotating at least daily makes
# journald vacuum the old entries promptly rather than waiting for a large file to fill up.
[Journal]
MaxRetentionSec=30day
MaxFileSec=1day
