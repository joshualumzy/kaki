<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b1d0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" rx="14" fill="url(#bg4)"/>

  <!-- Left Card: Delayed Johor Farm Lorry (12:00 PM Noon) -->
  <g transform="translate(22, 24)">
    <rect x="0" y="0" width="168" height="152" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#ef4444" stroke-width="2"/>
    <rect x="14" y="14" width="140" height="22" rx="6" fill="#7f1d1d"/>
    <text x="84" y="29" text-anchor="middle" fill="#fecaca" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">JOHOR FARM LORRY</text>

    <!-- Delivery Truck Icon -->
    <rect x="26" y="54" width="76" height="44" rx="6" fill="#f59e0b"/>
    <path d="M102 66 H130 L140 82 V98 H102 Z" fill="#fbbf24"/>
    <circle cx="46" cy="100" r="10" fill="#334155" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="120" cy="100" r="10" fill="#334155" stroke="#e2e8f0" stroke-width="3"/>

    <text x="84" y="128" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Delayed till 12pm Noon</text>
    <text x="84" y="142" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Misses 8:00 AM rush!</text>
  </g>

  <!-- Right Card: 60 Trays Backup Eggs ($180 Tonight) vs Push to Monday -->
  <g transform="translate(210, 24)">
    <rect x="0" y="0" width="168" height="152" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#2fe0c4" stroke-width="2"/>
    <rect x="14" y="14" width="140" height="22" rx="6" fill="#065f46"/>
    <text x="84" y="29" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">BACKUP EGG TRAYS</text>

    <!-- Two Soft-Boiled Eggs Bowl -->
    <ellipse cx="84" cy="76" rx="52" ry="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="68" cy="74" r="14" fill="#f97316"/>
    <circle cx="64" cy="70" r="4" fill="#ffedd5"/>
    <circle cx="100" cy="76" r="14" fill="#fbbf24"/>
    <circle cx="96" cy="72" r="4" fill="#fef9c3"/>

    <text x="84" y="128" text-anchor="middle" fill="#5eead4" font-family="system-ui, sans-serif" font-size="11" font-weight="800">60 Trays · $180 Tonight</text>
    <text x="84" y="142" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Or push promo to Monday</text>
  </g>
</svg>
