<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <style>
    @keyframes sunPulse {
      0%, 100% { opacity: 0.82; }
      50% { opacity: 1; }
    }
    @keyframes steamRise {
      0% { opacity: 0; transform: translateY(6px); }
      45% { opacity: 0.65; }
      100% { opacity: 0; transform: translateY(-14px); }
    }
    @keyframes kopiPour {
      0% { stroke-dashoffset: 28; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes kioskBlink {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.95; }
    }
    .sun-glow { animation: sunPulse 4s ease-in-out infinite; }
    .steam-1 { opacity: 0; animation: steamRise 2.8s ease-out infinite both; }
    .steam-2 { opacity: 0; animation: steamRise 2.8s ease-out 1.3s infinite both; }
    .kopi-stream { stroke-dasharray: 10 4; animation: kopiPour 0.65s linear infinite; }
    .kiosk-active { animation: kioskBlink 1.8s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f3d36"/>
      <stop offset="55%" stop-color="#145349"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="400" y1="20" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2fe0c4"/>
      <stop offset="100%" stop-color="#00a58e"/>
    </linearGradient>
  </defs>

  <!-- Heritage Kopitiam Tile Background -->
  <rect width="800" height="320" rx="20" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="64" x2="800" y2="64"/>
    <line x1="0" y1="128" x2="800" y2="128"/>
    <line x1="0" y1="192" x2="800" y2="192"/>
    <line x1="0" y1="256" x2="800" y2="256"/>
    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
  </g>

  <!-- Warm Raffles Place Morning Sunbeam -->
  <circle class="sun-glow" cx="380" cy="110" r="190" fill="url(#warmGlow)"/>

  <!-- Hanging Kopitiam Lamps -->
  <g class="lamp-1">
    <line x1="150" y1="0" x2="150" y2="48" stroke="#d97706" stroke-width="3"/>
    <path d="M118 48 C122 28, 178 28, 182 48 Z" fill="#047857" stroke="#fde68a" stroke-width="2"/>
    <ellipse cx="150" cy="52" rx="14" ry="6" fill="#fef08a"/>
  </g>
  <g class="lamp-2">
    <line x1="410" y1="0" x2="410" y2="40" stroke="#d97706" stroke-width="3"/>
    <path d="M378 40 C382 20, 438 20, 442 40 Z" fill="#047857" stroke="#fde68a" stroke-width="2"/>
    <ellipse cx="410" cy="44" rx="14" ry="6" fill="#fef08a"/>
  </g>

  <!-- Marble Counter Surface -->
  <rect x="0" y="232" width="800" height="88" fill="#f8fafc"/>
  <path d="M0 232 H800" stroke="#d97706" stroke-width="5"/>
  <path d="M40 255 Q95 245 140 265 T260 258" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <path d="M440 275 Q510 260 580 282 T710 265" stroke="#cbd5e1" stroke-width="2" fill="none"/>

  <!-- Left: Traditional Brass Nanyang Kopi Kettle & Flowing Pulling Stream -->
  <g transform="translate(55, 82)">
    <!-- Animated Steam -->
    <path class="steam-1" d="M55 -8 Q45 -24 58 -36" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
    <path class="steam-2" d="M75 -4 Q85 -22 72 -34" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
    <!-- Brass Kettle -->
    <path d="M32 30 L82 30 L92 125 L22 125 Z" fill="url(#brass)"/>
    <ellipse cx="57" cy="30" rx="25" ry="7" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <!-- Long Spout -->
    <path d="M84 65 C115 55, 130 22, 148 18" stroke="url(#brass)" stroke-width="9" stroke-linecap="round"/>
    <!-- Handle -->
    <path d="M30 42 C6 42, 6 105, 26 108" stroke="url(#brass)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Base Kopi Stream + Animated Flowing Stream -->
    <path d="M148 20 Q154 78 148 122" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <path class="kopi-stream" d="M148 20 Q154 78 148 122" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Center-Left: Iconic Floral Kopitiam Cup & Saucer -->
  <g transform="translate(172, 182)">
    <path class="steam-1" d="M30 -4 Q24 -16 34 -26" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="36" cy="54" rx="44" ry="11" fill="#e2e8f0" stroke="#0f766e" stroke-width="2.5"/>
    <path d="M8 10 H64 L58 50 C56 56, 16 56, 14 50 Z" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <path d="M62 18 C78 18, 78 40, 60 42" stroke="#0f766e" stroke-width="4" fill="none"/>
    <!-- Green & Red Floral Motif -->
    <circle cx="36" cy="30" r="7" fill="#e11d48"/>
    <circle cx="24" cy="30" r="4" fill="#0d9488"/>
    <circle cx="48" cy="30" r="4" fill="#0d9488"/>
    <ellipse cx="36" cy="10" rx="28" ry="5" fill="#78350f"/>
  </g>

  <!-- Center: Kaya Butter Toast Set & Two Soft-Boiled Kampong Eggs -->
  <g transform="translate(295, 168)">
    <!-- Plate -->
    <ellipse cx="95" cy="72" rx="92" ry="22" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <!-- Toast Slice 1 -->
    <rect x="26" y="34" width="76" height="44" rx="8" transform="rotate(-6 26 34)" fill="#d97706" stroke="#78350f" stroke-width="2.5"/>
    <rect x="33" y="39" width="62" height="32" rx="5" transform="rotate(-6 33 39)" fill="#f59e0b"/>
    <!-- Cold Butter Slab & Kaya -->
    <rect x="48" y="45" width="32" height="14" rx="3" transform="rotate(-6 48 45)" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Toast Slice 2 -->
    <rect x="78" y="28" width="76" height="44" rx="8" transform="rotate(5 78 28)" fill="#b45309" stroke="#78350f" stroke-width="2.5"/>
    <rect x="85" y="33" width="62" height="32" rx="5" transform="rotate(5 85 33)" fill="#d97706"/>
    <rect x="98" y="41" width="32" height="14" rx="3" transform="rotate(5 98 41)" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Soft-Boiled Eggs Saucer -->
    <g transform="translate(168, 18)">
      <ellipse cx="42" cy="48" rx="44" ry="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
      <ellipse cx="42" cy="46" rx="35" ry="13" fill="#fef9c3"/>
      <!-- Two Rich Orange Kampong Egg Yolks -->
      <g class="yolk-bob">
        <circle cx="31" cy="45" r="10" fill="#f97316"/>
        <circle cx="29" cy="42" r="3" fill="#ffedd5"/>
        <circle cx="53" cy="47" r="10" fill="#ea580c"/>
        <circle cx="51" cy="44" r="3" fill="#ffedd5"/>
      </g>
    </g>
  </g>

  <!-- Right: Glowing Self-Order Kiosk & Mobile Promo App -->
  <g transform="translate(590, 42)">
    <!-- Kiosk Stand -->
    <rect x="20" y="0" width="145" height="205" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="30" y="12" width="125" height="162" rx="10" fill="#1e293b"/>
    <!-- Kiosk Header -->
    <rect x="38" y="20" width="109" height="22" rx="5" fill="url(#screenGlow)"/>
    <!-- Kiosk Drink Grid (12 buttons) -->
    <g fill="#334155" stroke="#2fe0c4" stroke-opacity="0.55" stroke-width="1.5">
      <rect x="38" y="50" width="32" height="24" rx="4"/>
      <rect x="76" y="50" width="32" height="24" rx="4"/>
      <rect x="114" y="50" width="32" height="24" rx="4"/>
      <rect x="38" y="80" width="32" height="24" rx="4"/>
      <rect class="kiosk-active" x="76" y="80" width="32" height="24" rx="4" fill="#ff5a1f" fill-opacity="0.55" stroke="#ff5a1f" stroke-width="2"/>
      <rect x="114" y="80" width="32" height="24" rx="4"/>
      <rect x="38" y="110" width="32" height="24" rx="4"/>
      <rect x="76" y="110" width="32" height="24" rx="4"/>
      <rect x="114" y="110" width="32" height="24" rx="4"/>
    </g>
    <!-- Kiosk Bottom Action Bar -->
    <rect x="38" y="144" width="109" height="18" rx="5" fill="#ff5a1f"/>
    <!-- Pedestal -->
    <rect x="74" y="205" width="36" height="18" fill="#334155"/>
    <rect x="52" y="220" width="80" height="8" rx="4" fill="#475569"/>
  </g>
</svg>
