<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <defs>
    <linearGradient id="bgGrab" x1="0" y1="0" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06281E"/>
      <stop offset="100%" stop-color="#113E30"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" rx="18" fill="url(#bgGrab)"/>

  <!-- Left: Flashing GrabFood Tablet + Endless Receipt -->
  <rect x="44" y="38" width="220" height="168" rx="18" fill="#0F172A" stroke="#10B981" stroke-width="4"/>
  <rect x="64" y="58" width="180" height="42" rx="8" fill="#10B981"/>
  <text x="154" y="85" text-anchor="middle" fill="#052E16" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">GRABFOOD · 40</text>

  <rect x="64" y="114" width="180" height="70" rx="10" fill="#450A0A" stroke="#F87171" stroke-width="2.5"/>
  <text x="154" y="144" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900">+25 SET BULK</text>
  <text x="154" y="168" text-anchor="middle" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">12 Riders at Door!</text>

  <!-- Long Paper Docket Unrolling -->
  <path d="M124 206 L114 294 L194 294 L184 206 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="132" y1="226" x2="176" y2="226" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="246" x2="178" y2="246" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <line x1="128" y1="266" x2="180" y2="266" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>

  <!-- Right: Overloaded Single Conveyor Toaster -->
  <rect x="312" y="88" width="284" height="148" rx="20" fill="#27272A" stroke="#F97316" stroke-width="4"/>
  <rect x="336" y="128" width="236" height="54" rx="10" fill="#431407" stroke="#FB923C" stroke-width="2.5"/>
  <!-- Glowing Red Heating Element -->
  <line x1="348" y1="140" x2="560" y2="140" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
  <!-- 5 Toast Slices Jammed Inside -->
  <rect x="354" y="150" width="32" height="24" rx="5" fill="#D97706" stroke="#FDE68A" stroke-width="2"/>
  <rect x="396" y="150" width="32" height="24" rx="5" fill="#D97706" stroke="#FDE68A" stroke-width="2"/>
  <rect x="438" y="150" width="32" height="24" rx="5" fill="#D97706" stroke="#FDE68A" stroke-width="2"/>
  <rect x="480" y="150" width="32" height="24" rx="5" fill="#D97706" stroke="#FDE68A" stroke-width="2"/>
  <rect x="522" y="150" width="32" height="24" rx="5" fill="#D97706" stroke="#FDE68A" stroke-width="2"/>

  <text x="454" y="216" text-anchor="middle" fill="#FDBA74" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900">1 Toaster · Walk-Ins Wait 22m!</text>

  <!-- Smoke Puffs Above Toaster -->
  <circle cx="420" cy="54" r="18" fill="#94A3B8" fill-opacity="0.45"/>
  <circle cx="454" cy="42" r="24" fill="#94A3B8" fill-opacity="0.55"/>
  <circle cx="488" cy="56" r="16" fill="#94A3B8" fill-opacity="0.45"/>
</svg>
