<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" fill="none">
  <defs>
    <linearGradient id="guideBg" x1="0" y1="0" x2="800" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2fe0c4"/>
      <stop offset="100%" stop-color="#00a58e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="280" rx="18" fill="url(#guideBg)" stroke="#334155" stroke-width="2"/>

  <!-- LEFT HALF: THE MEETING STAGE -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="460" height="240" rx="14" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <text x="18" y="24" fill="#94a3b8" font-family="monospace" font-size="10.5" font-weight="700" letter-spacing="1.2">LEFT SIDE · LIVE AI COLLEAGUES &amp; CONTROLS</text>

    <!-- Floating Toast Callout -->
    <rect x="16" y="34" width="428" height="26" rx="8" fill="#064e3b" stroke="#2fe0c4" stroke-width="1.5"/>
    <text x="28" y="51" fill="#5eead4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">🔔 KAKI TOAST · Alerts you here whenever a task or company record pops up →</text>

    <!-- 4 Mini Video Tiles with Orbs & Captions -->
    <g transform="translate(16, 68)">
      <!-- Tile 1 (You) -->
      <rect x="0" y="0" width="136" height="114" rx="10" fill="#1e293b" stroke="#2fe0c4" stroke-width="1.5"/>
      <circle cx="68" cy="48" r="22" fill="#00a58e" fill-opacity="0.35" stroke="#2fe0c4" stroke-width="2"/>
      <text x="68" y="52" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">YOU</text>
      <text x="68" y="96" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Your Seat</text>

      <!-- Tile 2 (Sam - Speaking) -->
      <rect x="146" y="0" width="136" height="114" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="214" cy="40" r="20" fill="#0ea5e9"/>
      <rect x="154" y="68" width="120" height="38" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="214" y="84" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" font-weight="600">"What's your call</text>
      <text x="214" y="97" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">on this item?"</text>

      <!-- Tile 3 (Colleague) -->
      <rect x="292" y="0" width="136" height="114" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="360" cy="40" r="20" fill="#ff5a1f"/>
      <rect x="300" y="68" width="120" height="38" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="360" y="84" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Live captions appear</text>
      <text x="360" y="97" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">on every speaker tile</text>
    </g>

    <!-- Bottom Typebar & Pause Button -->
    <g transform="translate(16, 192)">
      <rect x="0" y="0" width="320" height="34" rx="17" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <text x="18" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5">💬 Speak on mic OR type here anytime + Enter</text>
      <rect x="330" y="0" width="98" height="34" rx="17" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
      <text x="379" y="21" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">⏸ Pause (Esc)</text>
    </g>
  </g>

  <!-- RIGHT HALF: THE KAKI WINGMAN DOCK -->
  <g transform="translate(496, 20)">
    <rect x="0" y="0" width="284" height="240" rx="14" fill="#111827" stroke="#2fe0c4" stroke-width="2"/>
    <text x="16" y="24" fill="#2fe0c4" font-family="monospace" font-size="10.5" font-weight="800" letter-spacing="1.2">RIGHT SIDE · YOUR KAKI WINGMAN</text>

    <!-- Zone 1: Needs You Now Action Card -->
    <rect x="14" y="34" width="256" height="68" rx="10" fill="#064e3b" fill-opacity="0.55" stroke="#2fe0c4" stroke-width="1.5"/>
    <text x="24" y="51" fill="#5eead4" font-family="monospace" font-size="9.5" font-weight="800">1. NEEDS YOU NOW (TOP)</text>
    <text x="24" y="66" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Assigned tasks &amp; record lookups</text>
    <rect x="24" y="73" width="114" height="21" rx="6" fill="url(#accentTeal)"/>
    <text x="81" y="87" text-anchor="middle" fill="#06201b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">Let Kaki do it →</text>
    <text x="146" y="87" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Clock holds!</text>

    <!-- Zone 2: Live Agenda & Topic Cheat-Sheet -->
    <rect x="14" y="110" width="256" height="68" rx="10" fill="#1e293b" stroke="#ff5a1f" stroke-width="1.5"/>
    <text x="24" y="127" fill="#ff8a5c" font-family="monospace" font-size="9.5" font-weight="800">2. LIVE TOPIC CHEAT-SHEET (MIDDLE)</text>
    <text x="24" y="143" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">2:00 timer + exact call on the table</text>
    <text x="24" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">+ Your role's key numbers as chips</text>

    <!-- Zone 3: Briefing & Live Transcript Drawers -->
    <rect x="14" y="186" width="256" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="24" y="204" fill="#e2e8f0" font-family="monospace" font-size="9.5" font-weight="700">3. BRIEFING &amp; TRANSCRIPT DRAWERS</text>
    <text x="24" y="219" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Click "Show" anytime to re-read</text>
  </g>
</svg>
