<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <style>
    @keyframes lensInspect {
      0%, 100% { transform: translate(-8px, -2px); }
      50% { transform: translate(10px, 3px); }
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @keyframes emojiFloat {
      0% { transform: translateY(4px) scale(0.9); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateY(-14px) scale(1.1); opacity: 0; }
    }
    .magnifying-glass { animation: lensInspect 3s ease-in-out infinite; }
    .live-badge { animation: livePulse 1.4s ease-in-out infinite; }
    .emoji-1 { opacity: 0; animation: emojiFloat 2.4s ease-out infinite both; }
    .emoji-2 { opacity: 0; animation: emojiFloat 2.4s ease-out 1.1s infinite both; }
  </style>
  <defs>
    <linearGradient id="bgButter" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f3d36"/>
      <stop offset="55%" stop-color="#145349"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sunButter" x1="130" y1="10" x2="130" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brassButter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Heritage Kopitiam Tile Wall -->
  <rect width="400" height="200" fill="url(#bgButter)"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="350" y1="0" x2="350" y2="200"/>
  </g>

  <!-- Hanging Kopitiam Lamp & Warm Morning Glow -->
  <circle cx="125" cy="70" r="115" fill="url(#sunButter)"/>
  <line x1="125" y1="0" x2="125" y2="24" stroke="#d97706" stroke-width="2.5"/>
  <path d="M102 24 C105 10, 145 10, 148 24 Z" fill="#047857" stroke="#fde68a" stroke-width="1.8"/>
  <ellipse cx="125" cy="27" rx="10" ry="4" fill="#fef08a"/>

  <!-- Marble Counter Surface -->
  <rect x="0" y="156" width="400" height="44" fill="#f8fafc"/>
  <path d="M0 156 H400" stroke="#d97706" stroke-width="3.5"/>
  <path d="M30 176 Q85 166 140 182 T260 174" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>

  <!-- Left: Artisanal Kaya Butter Toast Set on Heritage Plate + Animated Magnifying Glass -->
  <g transform="translate(22, 68)">
    <ellipse cx="102" cy="86" rx="92" ry="22" fill="#fef3c7" stroke="url(#brassButter)" stroke-width="2.5"/>
    <rect x="28" y="48" width="128" height="32" rx="8" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <rect x="34" y="53" width="116" height="22" rx="5" fill="#d97706"/>
    <path d="M36 48 Q92 42 148 48 L148 54 L36 54 Z" fill="#65a30d"/>
    <rect x="58" y="34" width="68" height="15" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>

    <g transform="rotate(-10 42 26)">
      <rect x="26" y="10" width="122" height="26" rx="7" fill="#d97706" stroke="#78350f" stroke-width="2"/>
      <line x1="48" y1="14" x2="42" y2="32" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="78" y1="14" x2="72" y2="32" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="108" y1="14" x2="102" y2="32" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Animated Inspector Magnifying Lens Scanning the Butter Slab -->
    <g class="magnifying-glass">
      <circle cx="110" cy="40" r="24" fill="#38bdf8" fill-opacity="0.2" stroke="url(#brassButter)" stroke-width="3.5"/>
      <line x1="127" y1="57" x2="146" y2="76" stroke="url(#brassButter)" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right: Smartphone Filming Live TikTok Review (@MakanWithZack · 90K Views) -->
  <g transform="translate(238, 16)">
    <rect x="0" y="0" width="138" height="166" rx="16" fill="#0f172a" stroke="#f43f5e" stroke-width="2.5"/>
    <rect x="8" y="10" width="122" height="146" rx="10" fill="#1e293b"/>

    <!-- Live Pill & View Count -->
    <rect class="live-badge" x="15" y="18" width="46" height="16" rx="8" fill="#e11d48"/>
    <text x="38" y="29" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="900">● LIVE</text>
    <rect x="66" y="18" width="56" height="16" rx="8" fill="#0f172a"/>
    <text x="94" y="29" text-anchor="middle" fill="#fda4af" font-family="system-ui, sans-serif" font-size="8" font-weight="700">90.4K</text>

    <!-- Reviewer Handle & Hook -->
    <text x="69" y="52" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">@MakanWithZack</text>
    <rect x="14" y="60" width="110" height="40" rx="7" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="69" y="76" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800">"Where did the cold</text>
    <text x="69" y="90" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" font-weight="800">butter slice go?!"</text>

    <!-- Floating Animated TikTok Reactions -->
    <g class="emoji-1">
      <circle cx="110" cy="122" r="10" fill="#e11d48" fill-opacity="0.28"/>
      <text x="110" y="126" text-anchor="middle" font-size="11">🔥</text>
    </g>
    <g class="emoji-2">
      <circle cx="110" cy="142" r="10" fill="#f43f5e" fill-opacity="0.28"/>
      <text x="110" y="146" text-anchor="middle" font-size="11">🧈</text>
    </g>

    <!-- Re-taste CTA Bar -->
    <rect x="14" y="112" width="82" height="34" rx="6" fill="#047857" stroke="#2fe0c4" stroke-width="1.2"/>
    <text x="55" y="126" text-anchor="middle" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700">8:30 AM RE-TASTE</text>
    <text x="55" y="138" text-anchor="middle" fill="#5eead4" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800">Live offer ready</text>
  </g>
</svg>
