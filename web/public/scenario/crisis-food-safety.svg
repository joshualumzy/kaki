<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <style>
    @keyframes tempPulse {
      0%, 100% { stroke-opacity: 0.75; }
      50% { stroke-opacity: 1; }
    }
    @keyframes steamRise {
      0% { opacity: 0; transform: translateY(4px); }
      50% { opacity: 0.75; }
      100% { opacity: 0; transform: translateY(-9px); }
    }
    .temp-alert { animation: tempPulse 2s ease-in-out infinite; }
    .bath-steam { animation: steamRise 2.3s ease-out infinite; }
  </style>
  <defs>
    <linearGradient id="bgSfa" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f3d36"/>
      <stop offset="55%" stop-color="#145349"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sunGlowSfa" x1="200" y1="0" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Heritage Kopitiam Tile Wall -->
  <rect width="400" height="200" fill="url(#bgSfa)"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="350" y1="0" x2="350" y2="200"/>
  </g>

  <circle cx="200" cy="60" r="115" fill="url(#sunGlowSfa)"/>

  <!-- Stainless Kitchen Counter -->
  <rect x="0" y="162" width="400" height="38" fill="#cbd5e1"/>
  <path d="M0 162 H400" stroke="#94a3b8" stroke-width="3"/>

  <!-- Left: Prep Fridge Unplugged Overnight -->
  <g transform="translate(18, 42)">
    <!-- Digital Temp Readout Header -->
    <g class="temp-alert">
      <rect x="18" y="0" width="144" height="34" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
      <text x="90" y="14" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" letter-spacing="0.04em">FRIDGE UNPLUGGED</text>
      <text x="90" y="27" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="10.5" font-weight="900">3 HOURS ⚠</text>
    </g>

    <!-- Water Bath Tank -->
    <rect x="10" y="42" width="160" height="78" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="2.5"/>
    <rect x="18" y="52" width="144" height="58" rx="6" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Soft-Boiled Eggs in Rack -->
    <ellipse cx="46" cy="84" rx="13" ry="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="76" cy="84" rx="13" ry="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="106" cy="84" rx="13" ry="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="136" cy="84" rx="13" ry="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Steam Whisps -->
    <path class="bath-steam" d="M55 46 Q59 38 55 30" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <path class="bath-steam" d="M95 46 Q99 38 95 30" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <path class="bath-steam" d="M130 46 Q134 38 130 30" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right: Food Agency Inspection Clipboard and Opening Alert -->
  <g transform="translate(206, 20)">
    <!-- Clipboard -->
    <rect x="6" y="12" width="164" height="132" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
    <rect x="61" y="4" width="54" height="16" rx="5" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>

    <!-- SFA Header -->
    <rect x="18" y="28" width="140" height="22" rx="5" fill="#dc2626"/>
    <text x="88" y="43" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" letter-spacing="0.03em">FOOD AGENCY · 9AM</text>

    <!-- Checklist Lines -->
    <text x="22" y="66" fill="#0f172a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800">• 8:00 AM: Doors open</text>
    <text x="22" y="84" fill="#0f172a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800">• 9:00 AM: Officer visit</text>
    <text x="22" y="102" fill="#b45309" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800">• Customer: review tonight</text>

    <!-- Pasteurized Backup Badge -->
    <rect x="18" y="112" width="140" height="22" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="88" y="126" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-size="8" font-weight="800">2 Crates (10:00 delivery)</text>
  </g>
</svg>
