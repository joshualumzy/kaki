<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <style>
    @keyframes sweatDrop {
      0% { transform: translateY(0px); opacity: 0.95; }
      75% { transform: translateY(8px); opacity: 0.95; }
      100% { transform: translateY(11px); opacity: 0; }
    }
    @keyframes steamDrift {
      0% { opacity: 0; transform: translateY(4px); }
      50% { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes codeType {
      0%, 100% { width: 28px; }
      50% { width: 44px; }
    }
    .sweat { animation: sweatDrop 1.9s ease-in infinite; }
    .kopi-steam { animation: steamDrift 2.2s ease-out infinite; }
    .laptop-line { animation: codeType 2s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bgChope" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f3d36"/>
      <stop offset="55%" stop-color="#145349"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="sunGlowChope" x1="140" y1="10" x2="140" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Heritage Kopitiam Tile Wall -->
  <rect width="400" height="200" fill="url(#bgChope)"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="350" y1="0" x2="350" y2="200"/>
  </g>

  <!-- Hanging Kopitiam Lamp & Sunbeam -->
  <circle cx="130" cy="65" r="110" fill="url(#sunGlowChope)"/>
  <line x1="130" y1="0" x2="130" y2="24" stroke="#d97706" stroke-width="2.5"/>
  <path d="M107 24 C110 10, 150 10, 153 24 Z" fill="#047857" stroke="#fde68a" stroke-width="1.8"/>
  <ellipse cx="130" cy="27" rx="10" ry="4" fill="#fef08a"/>

  <!-- Left: Classic Round Marble Kopitiam Table (Hogged by Laptop + Tissue Packet) -->
  <g transform="translate(22, 68)">
    <!-- Cast Iron Pedestal Leg -->
    <rect x="92" y="72" width="16" height="50" fill="#1e293b"/>
    <path d="M64 122 H136" stroke="url(#brassRim)" stroke-width="5" stroke-linecap="round"/>

    <!-- Round Marble Tabletop with Brass Rim -->
    <ellipse cx="100" cy="62" rx="92" ry="34" fill="#f8fafc" stroke="url(#brassRim)" stroke-width="4"/>
    <path d="M35 58 Q70 48 105 64 T165 56" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>

    <!-- Open Laptop Camping on Table -->
    <g transform="translate(34, 10)">
      <rect x="6" y="0" width="66" height="42" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <rect x="11" y="5" width="56" height="32" rx="3" fill="#1e293b"/>
      <rect class="laptop-line" x="16" y="11" width="28" height="4" rx="2" fill="#2fe0c4"/>
      <rect x="16" y="19" width="42" height="4" rx="2" fill="#64748b"/>
      <rect x="16" y="27" width="34" height="4" rx="2" fill="#f59e0b"/>
      <polygon points="0,42 78,42 84,50 -6,50" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    </g>

    <!-- Animated Red/White "CHOPE!" Tissue Packet -->
    <g transform="translate(124, 38) rotate(-6 26 20)">
      <rect x="0" y="6" width="56" height="28" rx="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="28" cy="6" rx="14" ry="7" fill="#ffffff"/>
      <text x="28" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="900" letter-spacing="0.03em">CHOPE!</text>
    </g>
  </g>

  <!-- Right: Diner Standing with Steaming Red Tray of Kopi & Soft-Boiled Eggs -->
  <g transform="translate(236, 24)">
    <!-- Speech Pill (Wider 148px box so text fits with wide margin) -->
    <g>
      <rect x="0" y="0" width="148" height="34" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
      <path d="M68 34 L62 44 L78 34 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="74" y="21" text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">"Zero seats left?!"</text>
    </g>

    <!-- Diner Character -->
    <circle cx="74" cy="66" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <path d="M67 60 Q70 57 73 60" stroke="#78350f" stroke-width="1.8" fill="none"/>
    <path d="M76 60 Q79 57 82 60" stroke="#78350f" stroke-width="1.8" fill="none"/>
    <path d="M69 72 Q74 68 79 72" stroke="#78350f" stroke-width="1.8" fill="none"/>
    <!-- Animated Sweat drop -->
    <path class="sweat" d="M94 52 C94 52, 99 60, 94 63 C89 60, 94 52, 94 52 Z" fill="#38bdf8"/>
    <path d="M46 140 C46 98, 102 98, 102 140 Z" fill="#0d9488" stroke="#5eead4" stroke-width="2"/>

    <!-- Traditional Red Kopitiam Tray with Floral Cup, Toast & 2 Kampong Eggs -->
    <g transform="translate(20, 96)">
      <rect x="0" y="22" width="108" height="12" rx="5" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5"/>
      <!-- Floral Kopi Cup with Animated Steam -->
      <path class="kopi-steam" d="M22 -4 Q18 -12 24 -18" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="14" y="2" width="18" height="20" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
      <circle cx="23" cy="12" r="3.5" fill="#e11d48"/>
      <!-- Soft-Boiled Eggs Saucer -->
      <ellipse cx="56" cy="18" rx="18" ry="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="51" cy="17" r="4.5" fill="#f97316"/>
      <circle cx="61" cy="17" r="4.5" fill="#ea580c"/>
      <!-- Kaya Toast -->
      <rect x="78" y="8" width="22" height="14" rx="3" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
      <rect x="83" y="11" width="12" height="5" rx="1.5" fill="#fef08a"/>
    </g>
  </g>
</svg>
