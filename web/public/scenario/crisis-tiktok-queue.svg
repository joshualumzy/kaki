<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <defs>
    <linearGradient id="bgTikTok" x1="0" y1="0" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1028"/>
      <stop offset="100%" stop-color="#351842"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" rx="18" fill="url(#bgTikTok)"/>

  <!-- Left: Smartphone on Ring Light Filming TikTok Live -->
  <circle cx="152" cy="148" r="82" stroke="#F472B6" stroke-width="8" fill="none" stroke-opacity="0.5"/>
  <rect x="108" y="62" width="88" height="172" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="3.5"/>
  <rect x="122" y="78" width="60" height="24" rx="6" fill="#EF4444"/>
  <text x="152" y="95" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900">LIVE · 85K</text>

  <!-- Cute Kaya Toast Plushie inside Phone Screen -->
  <rect x="128" y="120" width="48" height="42" rx="10" fill="#F59E0B" stroke="#FEF3C7" stroke-width="3"/>
  <circle cx="142" cy="138" r="3.5" fill="#1E293B"/>
  <circle cx="162" cy="138" r="3.5" fill="#1E293B"/>
  <path d="M145 148 Q152 154 159 148" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <text x="152" y="274" text-anchor="middle" fill="#FBCFE8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900">@MakanWithZack · 8:30 AM</text>

  <!-- Right: 100+ Crowd Spilling Toward Mall Escalator Warning Sign -->
  <rect x="308" y="42" width="286" height="94" rx="16" fill="#450A0A" stroke="#EF4444" stroke-width="3"/>
  <text x="451" y="80" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900">⚠️ MALL ESCALATOR</text>
  <text x="451" y="112" text-anchor="middle" fill="#FEF2F2" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">Max 18 People · $2,000 Fine!</text>

  <!-- Crowd Silhouettes Packing the Corridor -->
  <circle cx="348" cy="198" r="24" fill="#F472B6"/>
  <path d="M314 274 C314 240, 382 240, 382 274" fill="#DB2777"/>

  <circle cx="416" cy="194" r="26" fill="#A855F7"/>
  <path d="M380 274 C380 236, 452 236, 452 274" fill="#7E22CE"/>

  <circle cx="486" cy="198" r="24" fill="#38BDF8"/>
  <path d="M452 274 C452 240, 520 240, 520 274" fill="#0284C7"/>

  <circle cx="552" cy="202" r="22" fill="#FBBF24"/>
  <path d="M520 274 C520 244, 584 244, 584 274" fill="#D97706"/>
</svg>
