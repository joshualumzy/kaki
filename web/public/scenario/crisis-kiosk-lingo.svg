<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <style>
    @keyframes btnGlow {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 1; }
    }
    .kiosk-btn-glow { animation: btnGlow 1.6s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bgKiosk" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f3d36"/>
      <stop offset="55%" stop-color="#145349"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warmBeam" x1="260" y1="0" x2="260" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brassAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2fe0c4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Heritage Kopitiam Tile Wall -->
  <rect width="400" height="200" fill="url(#bgKiosk)"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="350" y1="0" x2="350" y2="200"/>
  </g>

  <!-- Warm Pendant Lamp & Sunbeam -->
  <circle cx="285" cy="68" r="115" fill="url(#warmBeam)"/>
  <line x1="285" y1="0" x2="285" y2="26" stroke="#d97706" stroke-width="2.5"/>
  <path d="M262 26 C265 12, 305 12, 308 26 Z" fill="#047857" stroke="#fde68a" stroke-width="1.8"/>
  <ellipse cx="285" cy="29" rx="10" ry="4" fill="#fef08a"/>

  <!-- Marble Counter -->
  <rect x="0" y="166" width="400" height="34" fill="#f8fafc"/>
  <path d="M0 166 H400" stroke="#d97706" stroke-width="3.5"/>
  <path d="M25 182 Q75 174 125 186 T220 180" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>

  <!-- Left: Self-Order Kiosk Pedestal with Kopi Buttons -->
  <g transform="translate(22, 16)">
    <rect x="0" y="0" width="144" height="146" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="9" y="9" width="126" height="122" rx="9" fill="#1e293b"/>
    <rect x="16" y="15" width="112" height="16" rx="4" fill="url(#tealGlow)"/>
    <text x="72" y="26" text-anchor="middle" fill="#042f2e" font-family="system-ui, sans-serif" font-size="8" font-weight="800" letter-spacing="0.05em">CHOOSE YOUR KOPI</text>

    <!-- Drink Buttons -->
    <rect class="kiosk-btn-glow" x="16" y="38" width="112" height="24" rx="5" fill="#0f172a" stroke="#2fe0c4" stroke-width="1.8"/>
    <circle cx="28" cy="50" r="5.5" fill="#78350f" stroke="#fde68a" stroke-width="1.2"/>
    <text x="39" y="53" fill="#5eead4" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Kopi O Kosong</text>

    <rect x="16" y="68" width="112" height="24" rx="5" fill="#0f172a" stroke="#2fe0c4" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="28" cy="80" r="5.5" fill="#b45309" stroke="#fde68a" stroke-width="1.2"/>
    <text x="39" y="83" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Teh C Siew Dai</text>

    <rect x="16" y="98" width="112" height="24" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="28" cy="110" r="5.5" fill="#92400e" stroke="#fde68a" stroke-width="1.2"/>
    <text x="39" y="113" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Kopi Gao Peng</text>

    <rect x="55" y="146" width="34" height="6" fill="#334155"/>
  </g>

  <!-- Right: Expressive Tourist Scratching Head + Floating Question Bubbles & Thermal Docket -->
  <g transform="translate(186, 38)">
    <!-- Thought Bubble (Wider 192px box so quotes stay cleanly inside) -->
    <rect x="0" y="0" width="192" height="44" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <path d="M52 44 L44 56 L64 44 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="96" y="19" text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">"Wait… what is Kosong?!"</text>
    <text x="96" y="34" text-anchor="middle" fill="#b45309" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Sugar? Evaporated milk? Iced?</text>

    <!-- Tourist Character -->
    <g transform="translate(18, 62)">
      <circle cx="34" cy="22" r="16" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
      <rect x="21" y="8" width="11" height="6" rx="2" fill="#0f172a"/>
      <rect x="35" y="8" width="11" height="6" rx="2" fill="#0f172a"/>
      <line x1="32" y1="11" x2="35" y2="11" stroke="#0f172a" stroke-width="2"/>
      <path d="M25 19 Q28 16 31 19" stroke="#7c2d12" stroke-width="1.8" fill="none"/>
      <path d="M37 18 Q40 21 43 18" stroke="#7c2d12" stroke-width="1.8" fill="none"/>
      <path d="M29 29 Q34 26 39 29" stroke="#7c2d12" stroke-width="1.8" fill="none"/>
      <path d="M10 66 C10 44, 58 44, 58 66 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text class="q-mark-1" x="-4" y="18" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="18" font-weight="900">?</text>
      <text class="q-mark-2" x="56" y="16" fill="#2fe0c4" font-family="system-ui, sans-serif" font-size="16" font-weight="900">?</text>
    </g>

    <!-- Kitchen Thermal Docket Printer on Counter -->
    <g transform="translate(108, 70)">
      <g class="docket-paper">
        <path d="M14 -14 H66 L70 26 H10 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <line x1="20" y1="-4" x2="58" y2="-4" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="4" x2="50" y2="4" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      </g>
      <rect x="0" y="22" width="80" height="36" rx="7" fill="#1e293b" stroke="url(#brassAccent)" stroke-width="2"/>
      <circle cx="66" cy="34" r="3.5" fill="#2fe0c4"/>
      <text x="40" y="48" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" letter-spacing="0.03em">DOCKET PRINTER</text>
    </g>
  </g>
</svg>
