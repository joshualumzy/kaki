<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31102f"/>
    </linearGradient>
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="200" rx="14" fill="url(#bg1)"/>
  <circle cx="210" cy="100" r="95" fill="url(#alertGlow)"/>

  <!-- Flying Kitchen Order Tickets -->
  <g transform="rotate(-14 75 75)">
    <rect x="42" y="38" width="66" height="84" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <line x1="52" y1="54" x2="96" y2="54" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="68" x2="88" y2="68" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="80" x2="92" y2="80" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="52" y="94" width="44" height="16" rx="4" fill="#f43f5e"/>
    <text x="74" y="106" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">50× $1</text>
  </g>

  <!-- Center Smartphone with Cart Exploit -->
  <g transform="translate(142, 16)">
    <rect x="0" y="0" width="116" height="168" rx="18" fill="#0f172a" stroke="#f43f5e" stroke-width="3"/>
    <rect x="8" y="12" width="100" height="144" rx="11" fill="#1e293b"/>
    <!-- Promo Banner -->
    <rect x="16" y="22" width="84" height="28" rx="6" fill="#00a58e"/>
    <text x="58" y="40" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">$1 KAYA SET</text>
    <!-- Toast Stack inside Phone -->
    <rect x="26" y="60" width="64" height="20" rx="5" fill="#d97706" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="22" y="74" width="72" height="20" rx="5" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Exploit Badge -->
    <rect x="16" y="106" width="84" height="36" rx="8" fill="#e11d48"/>
    <text x="58" y="122" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">CART QTY</text>
    <text x="58" y="136" text-anchor="middle" fill="#fef08a" font-family="monospace" font-size="13" font-weight="900">+ 50 SETS</text>
  </g>

  <!-- Right: Overheating Kitchen Printer & Warning Badge -->
  <g transform="translate(284, 54)">
    <rect x="0" y="36" width="82" height="58" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <path d="M14 36 V10 L24 16 L34 10 L44 16 L54 10 L68 16 V36 Z" fill="#fef2f2" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="64" cy="54" r="6" fill="#ef4444"/>
    <rect x="14" y="68" width="54" height="8" rx="4" fill="#0f172a"/>
  </g>
</svg>
