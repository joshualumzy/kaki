<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <style>
    @keyframes feePulse {
      0%, 100% { stroke-opacity: 0.75; }
      50% { stroke-opacity: 1; }
    }
    .fee-pill { animation: feePulse 2.1s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bgDelivery" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f3d36"/>
      <stop offset="55%" stop-color="#145349"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sunGlowDel" x1="200" y1="0" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Heritage Kopitiam Tile Wall -->
  <rect width="400" height="200" fill="url(#bgDelivery)"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="350" y1="0" x2="350" y2="200"/>
  </g>

  <circle cx="200" cy="60" r="115" fill="url(#sunGlowDel)"/>

  <!-- Marble Pickup Counter -->
  <rect x="0" y="164" width="400" height="36" fill="#f8fafc"/>
  <path d="M0 164 H400" stroke="#d97706" stroke-width="3.5"/>

  <!-- Left: Merchant Delivery Tablet Showing 32% Commission Squeeze -->
  <g transform="translate(18, 20)">
    <rect x="0" y="0" width="176" height="134" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="8" y="8" width="160" height="118" rx="8" fill="#1e293b"/>

    <rect x="16" y="14" width="144" height="18" rx="4" fill="#10b981"/>
    <text x="88" y="26" text-anchor="middle" fill="#042f2e" font-family="system-ui, sans-serif" font-size="8" font-weight="900" letter-spacing="0.03em">DELIVERY TABLET</text>

    <g class="fee-pill">
      <rect x="16" y="38" width="144" height="36" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
      <text x="88" y="53" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="8" font-weight="800">PLATFORM COMMISSION</text>
      <text x="88" y="68" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="10.5" font-weight="900">32% FEE (-$0.50/set)</text>
    </g>

    <text x="20" y="92" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">• Office platters: $5 profit</text>
    <text x="20" y="108" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">• Direct pickup: $2 profit</text>
  </g>

  <!-- Right: CBD Office Takeaway Bundles & Thermal Carrier Bags -->
  <g transform="translate(212, 34)">
    <!-- Thermal Delivery Bag -->
    <rect x="12" y="32" width="84" height="96" rx="8" fill="#059669" stroke="#a7f3d0" stroke-width="2"/>
    <path d="M34 32 C34 14, 74 14, 74 32" stroke="#a7f3d0" stroke-width="3" fill="none"/>
    <rect x="24" y="50" width="60" height="26" rx="4" fill="#047857"/>
    <text x="54" y="66" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900">CBD RUSH</text>

    <!-- Direct QR Self-Pickup Standee -->
    <rect x="108" y="46" width="58" height="82" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <rect x="121" y="56" width="32" height="32" rx="4" fill="#0f172a"/>
    <rect x="126" y="61" width="9" height="9" fill="#ffffff"/>
    <rect x="139" y="61" width="9" height="9" fill="#ffffff"/>
    <rect x="126" y="74" width="9" height="9" fill="#ffffff"/>
    <text x="137" y="102" text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900">QR EXPRESS</text>
    <text x="137" y="114" text-anchor="middle" fill="#b45309" font-family="system-ui, sans-serif" font-size="7" font-weight="700">SELF-PICKUP</text>
  </g>
</svg>
